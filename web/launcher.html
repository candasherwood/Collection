<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>JADELY</title>
    <link rel="stylesheet" href="/jadely.css" />
  </head>
  <body style="--accent: #e0a458; --accent-ink: #1b1204">
    <div class="shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">J</span>JADELY<span class="brand-sub">launcher</span></div>
        <nav class="nav">
          <a href="/launcher" class="active"><span class="dot"></span>Launcher</a>
          <a href="/store"><span class="dot"></span>Store</a>
          <a href="/news"><span class="dot"></span>News</a>
          <a href="/"><span class="dot"></span>Notes</a>
        </nav>
        <div class="topbar-right">
          <span class="faint" id="version"></span>
          <button class="btn small ghost" id="btn-refresh" title="Refresh the status">Refresh</button>
          <button class="btn small ghost" data-theme-toggle title="Light or dark">Theme</button>
          <button class="btn small danger" id="btn-stop-all" title="Stop every app the launcher started">
            Stop all
          </button>
        </div>
      </header>

      <main class="main">
        <div class="stat-strip" id="summary"></div>

        <div class="section-head" style="margin-top: 24px">
          <h2>Applications</h2>
          <span class="count" id="apps-count"></span>
        </div>
        <div class="launch-grid" id="apps"></div>

        <div class="section-head" style="margin-top: 26px">
          <h2>Library</h2>
          <span class="count" id="library-count"></span>
        </div>
        <div class="card" id="library-panel" style="padding: 14px 16px"></div>

        <div class="section-head" style="margin-top: 26px">
          <h2>Markdown → PDF</h2>
          <span class="count" id="convert-count"></span>
        </div>
        <div class="card" id="convert-panel" style="padding: 14px 16px"></div>

        <div class="section-head" style="margin-top: 26px">
          <h2>Folders</h2>
        </div>
        <div class="card" id="paths-panel" style="padding: 6px 8px"></div>
      </main>
    </div>

    <script src="/jadely.js"></script>
    <script src="/launcher.js"></script>
  </body>
</html>
