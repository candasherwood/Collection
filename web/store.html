<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>JADELY Store</title>
    <link rel="stylesheet" href="/jadely.css" />
  </head>
  <body style="--accent: #5fb3c9; --accent-ink: #04141a">
    <div class="shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">J</span>JADELY<span class="brand-sub">store</span></div>
        <nav class="nav">
          <a href="/launcher"><span class="dot"></span>Launcher</a>
          <a href="/store" class="active"><span class="dot"></span>Store</a>
          <a href="/news"><span class="dot"></span>News</a>
          <a href="/"><span class="dot"></span>Notes</a>
        </nav>
        <div class="topbar-right">
          <span class="faint" id="engine-note"></span>
          <button class="btn small" id="btn-import">Import…</button>
          <button class="btn small ghost" data-theme-toggle title="Light or dark">Theme</button>
          <button class="btn small ghost" id="btn-folders" title="Library folders">Folders</button>
        </div>
      </header>

      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="6" /><path d="m20 20-4.5-4.5" />
          </svg>
          <input id="q" type="search" placeholder="Search titles, tags and text…" autocomplete="off" />
        </div>
        <div class="filters" id="kind-filters"></div>
        <div class="grow"></div>
        <select class="rate" id="sort" title="Sort">
          <option value="name">Name</option>
          <option value="newest" selected>Newest</option>
          <option value="oldest">Oldest</option>
          <option value="size">Largest</option>
          <option value="duration">Longest audio</option>
          <option value="words">Most words</option>
        </select>
        <button class="btn small" id="view-grid" title="Grid">&#9638;</button>
        <button class="btn small ghost" id="view-list" title="List">&#9776;</button>
      </div>

      <div class="split">
        <aside class="rail" id="rail"></aside>
        <main class="main">
          <div class="section-head">
            <h2 id="view-title">Everything</h2>
            <span class="count" id="view-count"></span>
            <div class="grow"></div>
            <button class="btn small ghost hidden" id="btn-convert-here"></button>
          </div>
          <div id="items"></div>
        </main>
        <aside class="panel" id="panel"></aside>
      </div>
    </div>

    <div id="player-mount"></div>
    <div id="modals"></div>

    <script src="/markdown.js"></script>
    <script src="/jadely.js"></script>
    <script src="/store.js"></script>
  </body>
</html>
